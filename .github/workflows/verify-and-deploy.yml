name: Validate and deploy reviewed reports
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: verified-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run publication validation regression tests
        run: node --test research/validate-publication.test.js
      - name: Test semantic warning benchmark (diagnostic only)
        run: |
          node --test research/benchmark-semantic.test.js
          node research/benchmark-semantic.js research/benchmarks/semantic-cases-2026-10.json
      - name: Validate blind-review candidate pack (preparation only)
        run: |
          node --test research/validate-blind-pack.test.js
          node research/validate-blind-pack.js research/benchmarks/blind-review-candidates-60.json
      - name: Validate reader feedback form and public entry points
        run: |
          node --test research/validate-reader-feedback.test.js
          node --test research/summarize-reader-feedback.test.js
      - name: Self-test no-login feedback fallback safety
        run: node --test research/validate-no-login-feedback.test.js
      - name: Test safe weekly draft scaffold
        run: node --test research/scaffold-weekly.test.js
      - name: Test cumulative candidate imports and 30-day backfill
        run: node --test research/ingest-candidates.test.js
      - name: Test daily editorial pack without publishing
        run: node --test research/prepare-daily-brief.test.js
      - name: Validate provisional primary-source semantic screening
        run: node --test research/validate-primary-source-screening.test.js
      - name: Validate sixty-case provisional semantic screening completeness
        run: node --test research/validate-semantic-remaining40.test.js
      - name: Verify documentary contradiction probes and provenance
        run: node --test research/validate-documentary-probes.test.js
      - name: Validate structured source fact matching and abstentions
        run: |
          node --test research/compare-source-facts.test.js
          node research/compare-source-facts.js research/benchmarks/structured-source-fact-probes-2026-10-09.json
      - name: Validate Chinese claim coverage and missing assertion warnings
        run: node --test research/audit-chinese-claim-coverage.test.js
      - name: Verify v1.7 historical knowledge base without publishing
        run: |
          node --test research/validate-knowledge-base.test.js
          node --test research/knowledge-base-utils.test.js
          node --test research/knowledge-base-import-preview.test.js
          node research/validate-knowledge-base.js .
      - name: Validate issue manifests and claim metadata
        run: node research/validate-publication.js .
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && vars.ENABLE_VERIFIED_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build public-only Pages artifact
        run: |
          mkdir -p _public_site/publication
          cp index.html .nojekyll _public_site/
          for dir in feedback weekly monthly daily; do
            if [ -d "$dir" ]; then cp -R "$dir" "_public_site/$dir"; fi
          done
          cp publication/issues.json _public_site/publication/issues.json
          test ! -e _public_site/research
          test -f _public_site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public_site
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
